name: Deploy Jekyll site to Pages
on:
  push:
    branches: ["main"]
  schedule:
    # Daily rebuild so future-dated posts in _posts/ go live automatically on their
    # publish date, with no manual step. 03:30 UTC = 09:00 IST.
    - cron: "30 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  # Deliberately NOT a dependency of build/deploy. Renaming a post title makes its
  # social card stale, and this surfaces that as a red check — but publishing runs
  # on a daily cron, so a forgotten `python3 scripts/make_og_cards.py` must never
  # be able to stop scheduled posts from going live. Advisory, not a gate.
  og-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pillow
      - run: python3 scripts/make_og_cards.py --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment