name: Deploy Jekyll site to Pages
on:
  push:
    branches: ["main"]
  schedule:
    # Daily rebuild so future-dated posts in _posts/ go live automatically on their
    # publish date, with no manual step. GitHub delayed the single 03:30 UTC run by
    # 4.5-7.5 hours (Oct 2026), so several off-peak times give the first one that
    # fires a chance to land near 09:00 IST. None may be earlier than 03:30 UTC
    # (09:00 IST, the posts' publish time), or that build would skip today's post.
    # Extra runs just rebuild the same site. IST: 09:01, 09:37, 10:13, 11:49.
    - cron: "31 3 * * *"
    - cron: "7 4 * * *"
    - cron: "43 4 * * *"
    - cron: "19 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  # Deliberately NOT a dependency of build/deploy. Renaming a post title makes its
  # social card stale, and this surfaces that as a red check — but publishing runs
  # on a daily cron, so a forgotten `python3 scripts/make_og_cards.py` must never
  # be able to stop scheduled posts from going live. Advisory, not a gate.
  og-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pillow
      - run: python3 scripts/make_og_cards.py --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/configure-pages@v5
        id: pages
      # Build with the Gemfile's versions (Jekyll 4.4, jekyll-seo-tag 2.9), the same as
      # local builds and pr-checks.yml. actions/jekyll-build-pages ignored the Gemfile and
      # built with GitHub's own gem set (Jekyll 3.10), so a PR could pass on one version and
      # deploy on another. Switched 21 Nov 2026 after checking the two builds render the
      # same text and identical screenshots. JEKYLL_ENV=production turns on analytics.
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment