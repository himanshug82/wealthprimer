title: Wealth Primer
description: >-
  Financial education, one concept at a time — fundamental analysis, technical
  analysis, mutual funds, and financial jargon explained for Indian retail
  investors. Educational content only, not investment advice.
url: "https://dummynotes.com"
baseurl: ""

lang: en-IN
timezone: Asia/Kolkata # keeps scheduled/dated posts publishing on IST, not the CI runner's UTC clock

# --- analytics ---
# GoatCounter. Set this to the site CODE only — the "CODE" in
# https://CODE.goatcounter.com — NOT the full URL. Leave blank/unset and no
# analytics script is emitted at all (see _includes/analytics.html), and
# /privacy/ automatically keeps saying the site runs no analytics. Setting it
# flips BOTH the script and the privacy disclosure on together, by design:
# the two must never disagree.
goatcounter: ""

# --- email list ---
# Renders _includes/newsletter.html on every post and the homepage. Nothing is
# emitted until `action` is non-empty, so a half-configured list ships nothing.
# Mailchimp: paste the whole <form action="..."> URL from the embedded-form
# builder (it already carries ?u=...&id=...), then copy that form's hidden
# bot-trap field NAME — b_<u>_<id> — into `honeypot`.
# Buttondown: set provider to `buttondown`, action to
# https://buttondown.com/api/emails/embed-subscribe/USERNAME, honeypot to "".
# Full setup notes live in _includes/newsletter.html.
newsletter:
  provider: mailchimp
  action: ""
  honeypot: ""
  heading: "Get each post when it lands"
  blurb: >-
    One concept at a time, every day. No tips, no calls, no hype —
    just the explainers. Unsubscribe whenever.

# --- theme ---
theme: minima
minima:
  skin: classic
  # show_excerpts REMOVED — it was a no-op. minima's home layout prints
  # `post.excerpt`, but 68 of 69 posts open with a {% assign %} block, which is
  # what Jekyll takes as the first paragraph, and it renders to an empty string.
  # _layouts/home.html now overrides minima's and prints each post's explicit
  # `description:` instead. Re-adding this key will not bring excerpts back.

# --- author / contact ---
# NOTE: minima's footer/social include reads these as flat top-level keys
# (site.author, site.twitter_username, etc.) — not a nested list. In particular
# `author:` must stay a STRING: minima's footer prints `{{ site.author | escape }}`
# and would render a raw hash otherwise. jekyll-seo-tag needs the Twitter handle
# too, so that lives in _data/authors.yml, keyed on this exact name — see the
# comment in that file before renaming the author here.
author: Himanshu Gupta
email: himanshu.direct@gmail.com
twitter_username: wealthprimer_in
# linkedin_username: intentionally unset — there is no Wealth Primer LinkedIn
# presence yet. It previously pointed at linkedin.com/feed/, which just sends a
# visitor to their OWN feed. Set this (and the sameAs link below, and the About
# page bullet) together, once a real profile or company page exists.
rss: RSS
# github_username intentionally left unset: github.com/wealthprimer/wealthprimer is the
# blog's demo-scripts repo, not a personal profile — linked separately from the About page.

# --- navigation ---
# minima's header lists EVERY page with a title unless header_pages is set.
# With four series pages now under /series/, the nav needs explicit control —
# the individual series pages are reached from /series/, not the top nav.
header_pages:
  - series.markdown
  - case-study.markdown
  - about.markdown
  - privacy.markdown

# --- SEO / social meta (used by jekyll-seo-tag for OG cards, Twitter cards, JSON-LD) ---
twitter:
  username: wealthprimer_in
  card: summary_large_image
social:
  name: Himanshu Gupta
  links:
    - "https://twitter.com/wealthprimer_in"
logo: /assets/icon.png  # square mark, used for schema.org/JSON-LD logo

# --- plugins (all run fine here since Pages deploys via GitHub Actions, not the legacy
#     restricted Pages builder — any plugin in the Gemfile's jekyll_plugins group works) ---
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# --- publishing pipeline ---
# false (the default, made explicit here) means a post whose `date:` is still in the
# future is left OUT of the build entirely — this is what makes "schedule a post for
# a future date" work. Never flip this to true.
future: false
permalink: /:year/:month/:day/:title/

# --- front matter defaults ---
# jekyll-seo-tag's og:image/twitter:image only reads `image:` from a page's own
# front matter (not site config), so set it here as a default every page/post
# inherits; a post can still override with its own `image:` front matter.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/logo.png

# --- don't ship repo/editorial files as public pages ---
exclude:
  - CLAUDE.md
  - TODO.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
