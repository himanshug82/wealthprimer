# "Desi Bites goes public" — the M5 (Valuation/Market) narrative beat.
# Desi Bites Foods Pvt Ltd converts to Desi Bites Foods Ltd and lists via a
# fresh-issue IPO shortly after FY25 year-end, priced off the FY25 numbers
# already in this file. All figures below are the fictional company's own
# invented IPO terms — not derived from any real listing.
listing:
  company_name_post_listing: "Desi Bites Foods Ltd"
  exchange: "NSE Emerge (SME platform, illustrative)"
  listing_date: "15 June 2025"
  ipo_price: 640                       # Rs per share
  fresh_issue_shares_lakh: 2.5         # new shares issued, raising growth capital
  pre_ipo_shares_lakh: 10              # unchanged from share_data above
  post_ipo_shares_lakh: 12.5           # pre_ipo + fresh_issue
  ipo_proceeds: 1600                   # Rs Lakh = fresh_issue_shares_lakh * ipo_price / 100, ignoring issue expenses for simplicity
  post_ipo_equity: 2278                # FY25 closing equity (678) + ipo_proceeds (1600)
  post_ipo_cash: 1880                  # FY25 closing cash (280) + ipo_proceeds (1600), assumes proceeds held as cash, no debt paydown
  post_ipo_debt: 400                   # unchanged FY25 term loan — IPO proceeds weren't used to deleverage
  market_cap: 8000                     # ipo_price * post_ipo_shares_lakh / 100000 * 100000... = 640 * 12,50,000 = Rs 80 crore = Rs 8,000 Lakh
  # Two EPS figures deliberately kept distinct, for the EPS/P/E posts to
  # contrast: undiluted uses the FY25 PAT over the PRE-ipo share count (the
  # share count that actually earned that profit); diluted uses the POST-ipo
  # share count (the share count an investor buying at listing actually
  # owns a claim on). P/E should use diluted EPS — using undiluted EPS
  # against the listing price is a common beginner mistake, covered in the
  # EPS and P/E posts.
  eps_undiluted: 20.90                 # FY25 PAT (209) / pre_ipo_shares_lakh (10)
  eps_diluted: 16.72                   # FY25 PAT (209) / post_ipo_shares_lakh (12.5)
  book_value_per_share: 182.24         # post_ipo_equity (2278) / post_ipo_shares_lakh (12.5)
  dividend_per_share_fy25: 8.40        # FY25 dividend (84 Lakh) / pre_ipo_shares_lakh (10) — paid before the IPO, to pre-IPO holders
  ev: 6520                             # market_cap (8000) + post_ipo_debt (400) - post_ipo_cash (1880)
  pat_growth_fy24_fy25_pct: 49.3       # (209 - 140) / 140, for the PEG post

# --- Fundamental Analysis series additions -------------------------------
# DuPont decomposition of FY25 ROE. IMPORTANT: all three components must sit
# on the SAME averaging basis for the identity to reconcile exactly — net
# margin on FY25 revenue, asset turnover on AVERAGE total assets, and the
# equity multiplier on AVERAGE total assets / AVERAGE equity. The
# `equity_multiplier: 1.98` under `ratios.FY25` above is on a CLOSING-balance
# basis and deliberately does NOT reconcile here; that gap is used as a
# teaching point in the DuPont post rather than being "fixed".
dupont:
  FY25:
    net_margin: 8.06              # PAT 209 / revenue 2592
    asset_turnover: 2.01          # revenue 2592 / avg total assets 1288.5
    equity_multiplier_avg: 2.09   # avg total assets 1288.5 / avg equity 615.5
    avg_total_assets: 1288.5      # (FY24 1232 + FY25 1345) / 2
    avg_equity: 615.5             # (FY24 553 + FY25 678) / 2
    roe_reconciled: 34.0          # 8.06% x 2.0116 x 2.0934 = 33.96%, i.e. the reported ROE
    # Average-basis equity multiplier for the two prior years, so the DuPont
    # post can show the leverage TREND without silently switching to the
    # closing-basis figures under `ratios` (which would mix bases).
    equity_multiplier_avg_fy23: 2.35   # avg assets 1011.0 / avg equity 431.0
    equity_multiplier_avg_fy24: 2.26   # avg assets 1144.5 / avg equity 507.5

# Discounted cash flow valuation of Desi Bites Foods Ltd, built entirely on
# the fictional company (never on the real one — see CLAUDE.md compliance
# guardrails: a DCF that outputs an intrinsic value for a real listed stock
# reads as a price target, which this blog does not publish).
#
# Valuation date: 1 April 2025 (start of FY26), POST-IPO capital structure
# from the `listing:` block above. Compared in the posts against the Rs 640
# IPO price, ignoring the ~2.5-month gap to the 15 June 2025 listing date.
# End-of-year discounting (no mid-year convention), for simplicity.
#
# Every assumption below is invented for teaching purposes, with one
# exception: cost_of_debt is derived from Desi Bites' own statements
# (FY25 interest 47 / average term loan ((460+400)/2 = 430) = 10.93%).
dcf:
  valuation_date: "1 April 2025"
  forecast_years: 5
  assumptions:
    tax_rate: 25.0                # Indian domestic corporate rate, rounded
    depreciation_pct_revenue: 4.5 # FY25 actual: 115 / 2592 = 4.4%
    nwc_pct_revenue: 8.68         # FY25 NWC (211 + 199 - 185 = 225) / revenue 2592
    terminal_growth: 5.0          # perpetual nominal growth, below nominal GDP
  wacc:
    risk_free_rate: 6.5           # ~10-year G-Sec yield, mid-2025, illustrative
    equity_risk_premium: 7.0      # illustrative India ERP
    beta: 1.10                    # illustrative small-cap packaged-foods beta
    cost_of_equity: 14.20         # 6.5 + 1.10 x 7.0 (CAPM)
    cost_of_debt: 10.93           # derived: FY25 interest 47 / avg debt 430
    cost_of_debt_after_tax: 8.20  # 10.93 x (1 - 0.25)
    market_value_equity: 8000     # listing.market_cap
    market_value_debt: 400        # listing.post_ipo_debt
    weight_equity: 95.2
    weight_debt: 4.8
    wacc: 13.91
  # Per-year forecast, Rs Lakh. fcff = ebit x (1 - tax) + depreciation
  # - capex - change in net working capital.
  forecast:
    - year: "FY26"
      revenue_growth: 18.0
      revenue: 3058.6
      ebitda_margin: 17.2
      ebitda: 526.1
      depreciation: 137.6
      ebit: 388.4
      nopat: 291.3
      capex: 244.7
      capex_pct_revenue: 8.0
      change_in_nwc: 40.5
      fcff: 143.8
      discount_factor: 0.8779
      pv: 126.2
    - year: "FY27"
      revenue_growth: 16.0
      revenue: 3547.9
      ebitda_margin: 17.4
      ebitda: 617.3
      depreciation: 159.7
      ebit: 457.7
      nopat: 343.3
      capex: 283.8
      capex_pct_revenue: 8.0
      change_in_nwc: 42.5
      fcff: 176.6
      discount_factor: 0.7706
      pv: 136.1
    - year: "FY28"
      revenue_growth: 14.0
      revenue: 4044.6
      ebitda_margin: 17.5
      ebitda: 707.8
      depreciation: 182.0
      ebit: 525.8
      nopat: 394.4
      capex: 242.7
      capex_pct_revenue: 6.0
      change_in_nwc: 43.1
      fcff: 290.6
      discount_factor: 0.6765
      pv: 196.6
    - year: "FY29"
      revenue_growth: 12.0
      revenue: 4530.0
      ebitda_margin: 17.5
      ebitda: 792.7
      depreciation: 203.8
      ebit: 588.9
      nopat: 441.7
      capex: 226.5
      capex_pct_revenue: 5.0
      change_in_nwc: 42.1
      fcff: 376.9
      discount_factor: 0.5939
      pv: 223.8
    - year: "FY30"
      revenue_growth: 10.0
      revenue: 4983.0
      ebitda_margin: 17.5
      ebitda: 872.0
      depreciation: 224.2
      ebit: 647.8
      nopat: 485.8
      capex: 249.1
      capex_pct_revenue: 5.0
      change_in_nwc: 39.3
      fcff: 421.6
      discount_factor: 0.5213
      pv: 219.8
  result:
    pv_forecast_fcff: 902.5       # sum of the five pv figures above
    terminal_value: 4966.1        # FY30 FCFF 421.6 x 1.05 / (0.1391 - 0.05)
    pv_terminal_value: 2589.0     # 4966.1 x 0.5213
    terminal_pct_of_ev: 74.2      # pv_terminal_value / enterprise_value
    enterprise_value: 3491.5      # 902.5 + 2589.0
    net_debt: -1480               # post_ipo_debt 400 - post_ipo_cash 1880 (net CASH)
    equity_value: 4971.5          # 3491.5 - (-1480)
    shares_lakh: 12.5             # listing.post_ipo_shares_lakh
    value_per_share: 397.72       # 4971.5 Lakh / 12.5 lakh shares
    ipo_price: 640                # listing.ipo_price, for comparison
    gap_vs_ipo_price_pct: -37.9   # value_per_share / ipo_price - 1
  # Reverse DCF: holding the same forecast and WACC, what perpetual growth
  # rate would the Rs 640 IPO price require? And what operating scenarios
  # get there at the base 5% terminal growth?
  reverse:
    ev_implied_by_ipo_price: 6520        # 640 x 12.5 lakh shares + net debt (-1480); ties to listing.ev
    implied_terminal_growth: 9.62        # vs 5.0% assumed above
    cash_flow_multiple_required: 1.87    # forecast FCFF would need to be 1.87x
    scenario_market_case: 595            # 25% revenue growth, EBITDA margin to 20%, capex easing
    scenario_aggressive: 753             # 30% revenue growth, EBITDA margin to 22%
  # Sensitivity grid: value per share (Rs) at varying WACC (rows) and
  # terminal growth (columns). Base case (13.91%, 5.0%) = 398.
  sensitivity:
    terminal_growth_cols: [3.0, 4.0, 5.0, 6.0, 7.0]
    rows:
      - wacc: 12.91
        values: [384, 407, 437, 474, 525]
      - wacc: 13.41
        values: [369, 390, 416, 449, 492]
      - wacc: 13.91
        values: [357, 375, 398, 426, 463]
      - wacc: 14.41
        values: [345, 361, 381, 406, 438]
      - wacc: 14.91
        values: [334, 349, 367, 389, 416]
