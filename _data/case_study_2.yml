  - name: Corporate governance report
    pages: '15'
    who_writes: Board
    read_order: 7
    what_it_is: Board composition, committee meetings, remuneration. Skim for independent-director resignations
      and attendance.
  - name: Independent auditor's report
    pages: '6'
    who_writes: Auditor
    read_order: 1
    what_it_is: Opinion (unmodified / qualified / adverse / disclaimer), Key Audit Matters, emphasis-of-matter
      paragraphs. Six pages that can change everything.
  - name: Financial statements
    pages: '5'
    who_writes: Management (audited)
    read_order: 2
    what_it_is: Balance sheet, P&L, cash flow, statement of changes in equity. The five pages this blog
      spent thirty posts on.
  - name: Notes to accounts
    pages: '70'
    who_writes: Management (audited)
    read_order: 4
    what_it_is: Half the report. Accounting policies, related parties, contingent liabilities, borrowings,
      revenue by segment, tax reconciliation. Where the bodies are buried.
  - name: Shareholding pattern & other information
    pages: '12'
    who_writes: Company secretary
    read_order: 8
    what_it_is: Who owns what, pledges, top-ten holders, distribution of holdings.
  notes_to_read_first:
  - note: Significant accounting policies
    why: Revenue recognition and capitalisation policy set the rules for every number that follows.
  - note: Related party transactions (Ind AS 24)
    why: Every rupee that crossed between the company and people who control it.
  - note: Contingent liabilities and commitments (Ind AS 37)
    why: Claims not yet on the balance sheet.
  - note: Borrowings
    why: Maturity, security, covenants, and any default.
  - note: Trade receivables ageing
    why: Whether the debtor-days number is one big slow customer or many small ones.
  - note: Business combinations (Ind AS 103)
    why: What was bought, what was paid, and how much of it is goodwill.
  - note: Exceptional items and other income
    why: The two lines that most often flatter a bad year or hide a good one.
  kam_example: Revenue recognition around the year-end (cut-off) — a standard Key Audit Matter for a distributor-led
