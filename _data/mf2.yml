categories:
  circular: SEBI/HO/IMD/DF3/CIR/P/2017/114, 6 October 2017 (categorisation and rationalisation of mutual fund schemes), as
    amended
  master_circular: Master Circular for Mutual Funds, 27 June 2024 (clause 2.6)
  revision_2026: HO/24/13/15(2)2026-IMD-RAC4/I/5764/2026, 26 February 2026
  equity:
  - category: Large cap
    rule: At least 80% of assets in large-cap stocks
    universe: Stocks ranked 1st to 100th by market cap
  - category: Large & mid cap
    rule: At least 35% in large caps AND at least 35% in mid caps
    universe: Ranks 1-100 and 101-250
  - category: Mid cap
    rule: At least 65% in mid-cap stocks
    universe: Ranks 101st to 250th
  - category: Small cap
    rule: At least 65% in small-cap stocks
    universe: Rank 251st onwards
  - category: Multi cap
    rule: At least 75% in equity, with at least 25% EACH in large, mid and small caps
    universe: All three bands, forced
  - category: Flexi cap
    rule: At least 65% in equity; no minimum in any band
    universe: Anywhere the manager likes
  - category: Focused
    rule: At most 30 stocks; at least 80% in equity
    universe: Any band
  - category: Value
    rule: At least 80% in equity, following a value strategy
    universe: Any band
  - category: Contra
    rule: At least 80% in equity, following a contrarian strategy; a fund house running both value and contra must keep their
      overlap at or below 50%
    universe: Any band
  - category: Dividend yield
    rule: At least 80% in equity, mostly dividend-paying stocks
    universe: Any band
  - category: Sectoral / thematic
    rule: At least 80% in one sector or one theme
    universe: That sector or theme only
  - category: ELSS (equity-linked savings scheme)
    rule: At least 80% in equity, 3-year lock-in, tax deduction under the old regime
    universe: Any
  - category: Index fund / ETF (exchange-traded fund), filed under "Other schemes"
    rule: At least 95% in the securities of the index it tracks
    universe: Whatever the index holds
  debt:
  - category: Overnight
    rule: Securities maturing in 1 day
    risk: 'Rate: ~none. Credit: ~none.'
  - category: Liquid
    rule: Debt and money-market paper maturing within 91 days
    risk: 'Rate: very low. Credit: low, mostly top-rated.'
  - category: Ultra short duration
    rule: Macaulay duration 3 to 6 months
    risk: 'Rate: low.'
  - category: Low duration
    rule: Macaulay duration 6 to 12 months
    risk: 'Rate: low.'
  - category: Money market
    rule: Money-market instruments maturing within 1 year
    risk: 'Rate: low. Credit: depends on paper.'
  - category: Short duration
    rule: Macaulay duration 1 to 3 years
    risk: 'Rate: moderate.'
  - category: Medium duration
    rule: Macaulay duration 3 to 4 years
    risk: 'Rate: moderate to high.'
  - category: Medium to long duration
    rule: Macaulay duration 4 to 7 years
    risk: 'Rate: high.'
  - category: Long duration
    rule: Macaulay duration above 7 years
    risk: 'Rate: high.'
  - category: Dynamic bond
    rule: Any duration; manager decides
    risk: 'Rate: whatever the manager is betting on.'
  - category: Corporate bond
    rule: At least 80% in AA+ and above rated corporate bonds
    risk: 'Credit: low to moderate.'
  - category: Credit risk
    rule: At least 65% in AA and below rated corporate bonds
    risk: 'Credit: HIGH by design.'
  - category: Banking & PSU
    rule: At least 80% in debt of banks, PSUs (public sector undertakings) and public financial institutions
    risk: 'Credit: low.'
  - category: Gilt
    rule: At least 80% in government securities, any maturity
    risk: 'Rate: usually high. Credit: sovereign.'
  - category: Gilt with 10-year constant duration
    rule: At least 80% in G-secs (government securities), Macaulay duration held at 10 years
    risk: 'Rate: high and constant.'
  - category: Floater
    rule: At least 65% in floating-rate instruments
    risk: 'Rate: low by construction.'
  note: Regulatory definitions typed from the circular, not derived from data. Verify thresholds against the current text
    before relying on them.
