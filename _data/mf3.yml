  hybrid_para: 3.8.3
  hybrid_rules:
  - category: Conservative hybrid
    rule: Equity 10% to 25%; debt 75% to 90%
  - category: Balanced hybrid
    rule: Equity 40% to 60%; debt 40% to 60%; no arbitrage allowed
  - category: Aggressive hybrid
    rule: Equity 65% to 80%; debt 20% to 35%
  - category: Balanced advantage / dynamic asset allocation
    rule: Equity and debt, "managed dynamically" — no minimum or maximum in either
  - category: Multi asset allocation
    rule: At least three asset classes, at least 10% in each
  - category: Arbitrage
    rule: Follows an arbitrage strategy; at least 65% in equity and equity-related instruments
  - category: Equity savings
    rule: At least 65% in equity and equity-related instruments; net long equity 15% to 40%; at least 10% in debt
