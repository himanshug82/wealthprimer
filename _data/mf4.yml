regulation:
  master_circular:
    number: HO/24/13/11(1)2026-IMD-POD-1/I/7602/2026
    date: '2026-03-20'
    title: SEBI Master Circular for Mutual Funds
    url: https://www.sebi.gov.in/legal/master-circulars/mar-2026/master-circular-for-mutual-funds_100491.html
    read: 'Full text downloaded from sebi.gov.in and read on 25 October 2026. It applies alongside the SEBI (Mutual Funds)
      Regulations, 2026, in force from 1 April 2026. Later circulars may amend it: check the current text.'
  turnover_definition:
    para: Formats annex, Key Statistics table, note 3
    text: Portfolio turnover = lower of sales or purchases divided by the average AuM for the year or period.
  turnover_disclosure:
    para: Scheme Information Document format, investment strategy section
    text: Equity-oriented schemes must disclose a portfolio turnover policy and, where significant, the probable effect of
      their strategy on turnover, including higher brokerage and transaction costs.
  distributor_turnover:
    para: 6.7.3
    text: 'The Master Circular also uses ''portfolio turnover ratio'' for a distributor''s churn of client money (flagged
      at more than twice the industry average): a different thing from a fund''s turnover.'
  overnight:
    para: 3.8.2 (Debt Schemes, category table)
    text: Investment in overnight securities having maturity of 1 day; up to 5% of net assets may sit in G-secs or T-bills
      of residual maturity up to 30 calendar days as margin and collateral.
  liquid:
    para: 3.8.2 (Debt Schemes, category table)
    text: Investment in only debt and money market securities with maturity of up to 91 calendar days.
  money_market:
    para: 3.8.2 (Debt Schemes, category table)
    text: Investment in money market instruments having maturity up to 1 year.
  liquid_framework:
    para: 5.6.1 to 5.6.5
    liquid_assets_min_pct: 20
    text: Liquid funds hold at least 20% of net assets in liquid assets (cash, government securities, T-bills, repo on government
      securities); liquid and overnight funds may not park money in short-term bank deposits or buy structured-obligation
      or credit-enhanced debt (government-guaranteed excepted); an exit load applies on exit within 7 calendar days, graded
      as AMFI prescribes with the Board.
  idcw_names:
    para: '12.1'
    text: Options are named 'Payout of Income Distribution cum capital withdrawal option', 'Reinvestment of Income Distribution
      cum capital withdrawal option' and 'Transfer of Income Distribution cum capital withdrawal plan'.
  idcw_capital:
    para: 12.2 and 12.3
    text: Offer documents must disclose that amounts can be distributed out of investors' capital (equalisation reserve);
      the account statement must separate income distribution (NAV appreciation) from capital distribution.
  idcw_payment:
    para: '12.4'
    days: 7
    text: IDCW is paid within 7 working days of the record date.
  idcw_nav_fall:
    para: 12.5.1(b) and (e)
    text: The NAV is adjusted for the IDCW and statutory levy at close of business on the record date; the notice must state
      that the NAV will fall to the extent of the payout and statutory levy.
  idcw_advert:
    para: 14.1.3
    text: Advertisements of payouts must state, immediately below the payout figure, that the NAV will fall to the extent
      of the payout and statutory levy.
