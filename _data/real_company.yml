    revenue: 17942.67
    cost_of_materials_consumed: 9859.45
    purchases_of_stock_in_trade: 809.35
    changes_in_inventories: -64.75
    cogs: 10604.05
    gross_profit: 7338.62
    employee_benefits_expense: 704.59
    other_expenses: 3446.88
    opex: 4151.47
    ebitda: 3187.15
    depreciation: 313.34
    ebit: 2873.81
    interest: 138.80
    pbt: 2926.57
    exceptional_item: 24.79   # expense: Voluntary Retirement Scheme at one factory + related contract-labour costs (note 8); already inside pbt/pat
    tax: 748.71
    pat: 2178.73
    eps: 90.45

