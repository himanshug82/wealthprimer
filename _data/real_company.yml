# Britannia Industries Ltd — the real, listed-company anchor for the "real
# company" half of every Jargon, Decoded post (Desi Bites Foods for the
# fictional half). Same broad sector as Desi Bites (packaged snacks/FMCG
# manufacturer) so the ratios are intuitively comparable.
#
# All figures are the OFFICIAL AUDITED CONSOLIDATED numbers, taken directly
# from Britannia's results filing for the quarter/year ended 31 March 2025 —
# not estimates, not screener-style secondary aggregation. Do not edit these
# numbers without re-deriving from the source filing below.
#
# Source: Britannia Industries Ltd, Audited Consolidated Financial Results
# for the quarter and year ended 31 March 2025, filed with NSE/BSE on
# 8 May 2025.
#   https://media.britannia.co.in/Audited_Consolidated_Financial_Results_31_03_2025_74a7c03628.pdf
# NSE: BRITANNIA · BSE: 500825 · CIN: L15412WB1918PLC002964
#
# As-of date for every figure below: FY ended 31 March 2025 (FY24 columns
# are the filing's own comparative year, from the same document). Per the
# SEBI educational-content lag rule in CLAUDE.md, this is well over 3 months
# old at any post's publish date — safe to use without re-checking, unless
# a post is later updated to a newer fiscal year.

company:
  name: "Britannia Industries Ltd"
  type: "Listed packaged foods manufacturer (biscuits, bread, dairy, snacks)"
  currency_note: "All figures in Rs Crore unless noted"
  fiscal_year_end: "31 March"
  exchange: "NSE: BRITANNIA, BSE: 500825"
  source_url: "https://media.britannia.co.in/Audited_Consolidated_Financial_Results_31_03_2025_74a7c03628.pdf"
  source_label: "Audited Consolidated Financial Results, year ended 31 March 2025, filed with NSE/BSE 8 May 2025"
  as_of: "FY25 (year ended 31 March 2025), filed 8 May 2025"

# Line items exactly as reported in the consolidated Statement of Profit and
# Loss. cogs/gross_profit/opex/ebitda/ebit below are derived from these
# reported lines (not separately reported line items themselves) — see the
# comment on each. pbt/tax/pat are the actual reported figures (they include
# other income, share of JV loss, and an exceptional item in FY25 — small
# items a beginner-facing post can note rather than model line-by-line).
