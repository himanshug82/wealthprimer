# Cash flow lines exactly as reported in the consolidated Statement of Cash
# Flows, same source filing. cfo = net cash generated from operating
# activities. capex = acquisition of property, plant and equipment, capital
# work-in-progress and other intangible assets (the investing-activities
# line), taken as a positive outflow figure.
cash_flow:
  FY24:
    cfo: 2572.98
    capex: 552.87
  FY25:
    cfo: 2480.65
    capex: 374.85

# Ratios for FY25, computed the same way as site.data.case_study.ratios for
# an apples-to-apples comparison with Desi Bites: margins are on revenue;
# ROE uses PAT / average total_equity_owners; ROCE uses EBIT / average
# (total_equity + total_borrowings); ROA uses PAT / average total_assets.
# "Average" = mean of the FY24 and FY25 closing balance sheet above.
# inventory_days/receivable_days/payable_days use the FY25 CLOSING balance
# only (not average) — matches the convention already used in
# case_study.yml's ratios, i.e. inventory_days = 365 * inventory / cogs,
# receivable_days = 365 * trade_receivables / revenue, payable_days =
# 365 * trade_payables / cogs. ccc = inventory_days + receivable_days -
# payable_days. asset_turnover = revenue / average total_assets.
# current_ratio/quick_ratio/net_working_capital use FY25 closing balances
# (not average), same convention as case_study.yml. quick_ratio excludes
# only inventory from current assets (not prepaid/other items), matching
# the Desi Bites calculation. debt_equity and equity_multiplier use closing
# total_borrowings/total_assets against total_equity (incl. NCI, since
# these are whole-company capital-structure measures, same basis as ROCE).
# interest_coverage = EBIT / interest (FY25). net_debt_ebitda: net debt =
# total_borrowings - (cash_and_bank + current_investments) — a negative
# value means the company holds more cash+liquid investments than debt.
# fcf = cfo - capex (FY25). ocf_pat = cfo / pat (FY25). capex_intensity =
# capex / revenue (FY25), as a percentage.
ratios:
  FY25:
    gross_margin: 40.9
    ebitda_margin: 17.8
    net_margin: 12.1
    roe: 52.5
    roce: 49.5
    roa: 24.3
    inventory_days: 42.6
    receivable_days: 9.1
    payable_days: 60.3
    ccc: -8.6
    asset_turnover: 2.00
    net_working_capital: 295.42
    current_ratio: 1.08
    quick_ratio: 0.74
    debt_equity: 0.28
    equity_multiplier: 2.02
    interest_coverage: 20.7
    net_debt_ebitda: -0.06
    fcf: 2105.80
    ocf_pat: 1.14
    capex_intensity: 2.1

# Market/valuation data — separate from the financial-statement figures
# above, since a share price needs its own lag check under the SEBI
# educational-content rule in CLAUDE.md. Price is the NSE closing price on
# 30 June 2025 (source: Yahoo Finance historical data,
# https://finance.yahoo.com/quote/BRITANNIA.NS/history/), well over a year
# old at any post's publish date. Paired with the FY25 EPS/financials
# above (year ended 31 March 2025) for the P/E, P/B etc. calculations —
# i.e. this represents "the market's valuation shortly after FY25 results
# were digested," not a live/current price.
# shares_outstanding is derived, not separately reported: FY25 PAT
# (2178.73) / reported EPS (90.45) = 24.09 crore shares, which also
# equals equity_share_capital (24.09) at a face value of Rs 1 — self-
# consistent, so not an estimate.
# dividend_per_share is the single dividend paid during FY25 (ex-date
# 5 Aug 2024): source https://stockanalysis.com/quote/nse/BRITANNIA/dividend/
market:
  price_date: "30 June 2025"
  price: 5851.00                 # Rs per share, NSE close
  shares_outstanding_cr: 24.09   # crore shares
  market_cap_cr: 140950.59       # price * shares_outstanding_cr
  dividend_per_share_fy25: 73.50 # Rs per share, ex-date 5 Aug 2024 — the FY24 final dividend, paid during FY25 (no interim in FY25)
  dividend_per_share_fy25_declared: 75.00 # Rs per share, final dividend FOR FY25, ex-date 4 Aug 2025 (stockanalysis.com dividend history)
  ev_cr: 140751.24               # market_cap_cr + total_borrowings (FY25) - (cash_and_bank + current_investments) (FY25), all in Rs Cr
  pat_growth_fy24_fy25_pct: 1.8  # (2178.73 - 2139.81) / 2139.81 — a genuinely low single-year growth number, kept deliberately for the PEG post

# DuPont decomposition of FY25 ROE, for the Fundamental Analysis series.
# Same averaging basis as case_study.yml's `dupont` block so the two
# companies are directly comparable and the identity reconciles exactly:
# net margin on FY25 revenue, asset turnover on AVERAGE total assets, and
# equity multiplier on AVERAGE total assets / AVERAGE equity attributable
# to owners (the same equity base the ROE above uses). Note this differs
# from the closing-balance `equity_multiplier: 2.02` under `ratios.FY25`,
# which is on total equity incl. NCI — see the comment there.
dupont:
  FY25:
    net_margin: 12.14              # PAT 2178.73 / revenue 17942.67
    asset_turnover: "2.00"         # string so it renders 2.00x, not 2.0x; revenue 17942.67 / avg total assets 8956.06
    equity_multiplier_avg: 2.16    # avg total assets 8956.06 / avg equity 4148.62
    avg_total_assets: 8956.06      # (FY24 9073.56 + FY25 8838.55) / 2
    avg_equity_owners: 4148.62     # (FY24 3941.52 + FY25 4355.72) / 2
    roe_reconciled: 52.5           # 12.143% x 2.0034 x 2.1588 = 52.52%, i.e. the reported ROE

# Valuation multiples at the 30 June 2025 price above, against FY25
# financials — for the relative-valuation (comparables) post. Computed here
# rather than in Liquid so the arithmetic is reviewable in one place.
# book_value_per_share = total_equity_owners (4355.72 Cr) / shares (24.09 Cr).
multiples:
  as_of: "Price 30 June 2025, financials FY25 (year ended 31 March 2025)"
  pe: 64.7                         # price 5851 / EPS 90.45
  book_value_per_share: 180.81     # 4355.72 / 24.09
  pb: 32.4                         # price 5851 / 180.81
  ev_ebitda: 44.2                  # ev_cr 140751.24 / EBITDA 3187.15
  dividend_yield: 1.26             # DPS 73.50 / price 5851 x 100
