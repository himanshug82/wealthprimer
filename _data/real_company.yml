# Ratios for FY25, computed the same way as site.data.case_study.ratios for
# an apples-to-apples comparison with Desi Bites: margins are on revenue;
# ROE uses PAT / average total_equity_owners; ROCE uses EBIT / average
# (total_equity + total_borrowings); ROA uses PAT / average total_assets.
# "Average" = mean of the FY24 and FY25 closing balance sheet above.
ratios:
  FY25:
    gross_margin: 40.9
    ebitda_margin: 17.8
    net_margin: 12.1
    roe: 52.5
    roce: 49.5
    roa: 24.3
