  FY24:
    revenue: 16769.27
    cost_of_materials_consumed: 8546.89
    purchases_of_stock_in_trade: 941.48
    changes_in_inventories: 3.66
    cogs: 9492.03          # cost_of_materials_consumed + purchases + changes_in_inventories
    gross_profit: 7277.24  # revenue - cogs
    employee_benefits_expense: 708.70
    other_expenses: 3398.70
    opex: 4107.40           # employee_benefits_expense + other_expenses
    ebitda: 3169.84         # gross_profit - opex
    depreciation: 300.46
    ebit: 2869.38            # ebitda - depreciation
    interest: 164.00         # finance costs, as reported
    pbt: 2913.47              # as reported (includes other income, JV share)
    exceptional_item: 2.90    # expense, as reported (line VIII, note 8); already inside pbt/pat
    tax: 779.25
    pat: 2139.81              # profit attributable to owners of the company
    eps: 88.84
