# Reference list of the content tracks. `description` shows on the homepage cards and each
# series page; `about` is the longer "who it's for" text used only on /series/ (kept different
# from `description` so /series/ isn't a near-duplicate of the homepage in Google's eyes).
# Set a post's `series:` front matter
# to one of these slugs. Drives /series/, /series/<slug>/, the homepage cards,
# and the "Part N of M" line + prev/next navigation on every post.
#
# `planned` is the number of posts the series is written to have (the count in
# TODO.md's roadmap, including modules that are written but not yet published).
# It is the M in "Part N of M" while posts are still publishing — site.posts
# only sees published ones, so counting those would show "Part 3 of 3" on day
# three. Bump it when a module is added to a series; if it is ever missing or
# below the published count, the layout falls back to the published count.
# Optional `numbered: false` (for a grab-bag series such as `explainers`) hides "Part N of M"
# on posts; prev/next still work. Add a series with scripts/new_series.py (see .claude/skills/new-series).
- slug: jargon
  title: "Jargon, Decoded"
  description: "One financial term or ratio at a time — P/E, ROCE, P/B, and the rest, explained with a worked example."
  about: "Start here when a term in a report or a news story stops you. Each post takes one word or ratio: what it measures, the formula, a worked example on Desi Bites Foods or a real filing, and the ways people misread it. Posts are short and stand alone, so dip in by term."
  planned: 53   # M0-M5 (33) + M6 terms the other series lean on (12) + M7 market mechanics (8)
- slug: fundamental-analysis
  title: "Fundamental Analysis — Beginner to Expert"
  description: "Reading financial statements, key ratios, and valuation basics, from first principles to DCF."
  about: "For reading a company from its own filings. It moves from the three financial statements to ratios, then to what the numbers can hide, how banks and NBFCs differ, sector-specific measures, and the basics of valuing a business with a discounted cash flow. Best read in order; each post builds on the last."
  planned: 29   # FA-1..8 (8) + Reading between the lines (7) + Banks and NBFCs (6) + Sector lenses (8)
- slug: technical-analysis
  title: "Technical Analysis — Zero to Hero"
  description: "Candlesticks to chart patterns — plus an honest look at what technical analysis can't tell you."
  about: "For understanding what charts and indicators actually measure: candlesticks, support and resistance, moving averages, RSI, MACD and volume, with Python you can run on real price data. It then tests the popular claims honestly and is frank about what technical analysis cannot do."
  planned: 22   # TA-1..10 (10) + Module 2 (4) + Honest tests (8)
- slug: mutual-funds
  title: "Mutual Funds, Minus the Marketing"
  description: "Rolling returns, expense ratios, drawdowns, SIP myths, and how to actually read a factsheet."
  about: "For judging a fund by its numbers rather than its marketing: NAV, returns measured properly, costs, drawdowns, risk ratios, SIP arithmetic, categories and factsheets, each worked on real AMFI NAV history. No fund is recommended; the aim is to read any fund's numbers yourself."
  planned: 30   # MF-1..9 (9) + Module 2 (6) + Module 3 (8) + Module 4 (7)
- slug: tax
  title: "The Tax Side of Investing"
  description: "How capital gains, dividends and losses are actually taxed in India — mechanics first, with worked examples on real fund data."
  about: "For how investment income is taxed in India: capital gains on shares, funds, gold and debt, dividends and interest, losses, ESOPs, buybacks, F&O and foreign assets. Mechanics first, with worked examples, the rule's source and an as-of date in every post, and a reminder to check the current rule."
  planned: 18   # TAX-1..9 (9) + add-ons (4) + module 3 (5)
- slug: risk
  title: "Risk, Leverage and Your Own Brain"
  description: "What the F&O data says, what leverage does to a portfolio, how to size a position, and the biases that turn a temporary loss into a permanent one."
  about: "For the part of investing that happens before returns: what SEBI's F&O studies found, why losses compound against you, how leverage and position size change the outcome, why diversification is about correlation, and the biases that turn a temporary loss into a permanent one."
  planned: 16   # Module 1 (8) + Module 2 (8)
