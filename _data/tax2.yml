# The Tax Side of Investing — add-on module (TAX-10..13) worked examples.
#
# GENERATED by scripts/derive_tax2.py — do not edit by hand; edit the script
# and re-run it. Every rupee figure in the four posts renders from here.
#
# Same accuracy rules as _data/tax.yml: rates are FY 2026-27, VERIFIED against
# public sources in September 2026 (URLs in the `verification` block), not
# written from memory. The Income-tax Act, 2025 renumbered sections from
# 1 April 2026, so the posts teach mechanics and avoid section numbers.
# Buybacks are the exception where DATES matter: three regimes are shown.
#
# STILL OPEN: have a professional confirm the `verification.*.disagreements`
# items before these posts go out (first publish date 2026-12-14).

verification:
  financial_year: Tax Year 2026-27 (FY 2026-27)
  verified_on: September 2026
  how: Each rule below was checked against at least two public secondary sources on the dates shown. The
    primary text (Income-tax Act, 2025 / Finance Act, 2026) could not be fetched from incometaxindia.gov.in
    by automated means, same as the rest of the tax series.
  esop:
    rules:
    - Perquisite = FMV on exercise date minus exercise price, taxed as salary at slab in the year of exercise;
      employer deducts TDS (old s.192; renumbered under the 2025 Act).
    - 'RSU: perquisite = full FMV on vesting/settlement (exercise price nil); sell-to-cover is common.'
    - Capital gain at sale = sale price minus the FMV used for the perquisite; holding period runs from
      exercise/allotment.
    - 'Indian listed shares: STCG 20% (<=12 months), LTCG 12.5% above Rs 1.25 lakh. Unlisted or foreign
      shares: slab up to 24 months, 12.5% beyond, no Rs 1.25 lakh exemption.'
    - 'Deferral only for employees of DPIIT-recognised startups holding the Inter-Ministerial Board certificate
      (old s.80-IAC): tax/TDS due within 14 days of the earliest of: 60 months from the end of the relevant
      tax year (Income-tax Act, 2025, s.289(3) read with s.392(3); the 1961 Act''s s.192(1C) said 48 months
      from the end of the relevant assessment year, i.e. the same point in time), sale of the shares,
      or leaving the employer. Tax is computed at the rates of the year of exercise; only payment moves.'
    sources:
    - https://cleartax.in/s/taxation-on-esop-rsu-stock-options
    - https://www.finnovate.in/learn/blog/esop-vs-rsu-taxation-india
    - https://www.patronaccounting.com/blog/esop-tax-deferral-startup-employees-dpiit-section-80-iac
    - https://www.equitylist.co/blog-post/perquisite-tax-deferral-startups
    disagreements: One source phrases the deferral as 'five years from the end of the assessment year'.
      The 1961 Act (s.192(1C)) said 48 months from the end of the relevant assessment year; the 2025 Act
      (s.289(3), checked on eztax.in and indiankanoon.org in September 2026) says 60 months from the end
      of the relevant tax year. The post uses the 2025 Act wording and notes the old one.
  buyback:
    rules:
    - 'Up to 30 Sep 2024: company paid buyback tax (20% + 12% surcharge + 4% cess = 23.296%) on distributed
      income; shareholder exempt.'
    - '1 Oct 2024 to 31 Mar 2026: entire consideration deemed dividend in the shareholder''s hands, taxed
      at slab, TDS 10%, no deduction of cost against it; the cost of the tendered shares becomes a capital
      loss (sale consideration deemed nil), usable against capital gains and carried forward 8 years.'
    - 'From 1 Apr 2026 (Finance Act, 2026): buyback consideration taxed as CAPITAL GAINS (consideration
      minus cost) at the normal equity rates; PLUS an additional tax on PROMOTER shareholders bringing
      their effective rate to 22% (promoter companies) / 30% (other promoters), with a 12% surcharge prescribed
      on the additional component.'
    sources:
    - https://taxguru.in/income-tax/budget-2026-buyback-taxation-capital-gains-treatment-shareholders-additional-tax-promoters.html
    - https://taxguru.in/income-tax/buy-taxation-finance-act-2026-resettling-unsettledae.html
    - https://www.scconline.com/blog/post/2026/07/16/finance-act-2026-share-buyback-taxation-analysis/
    - https://vinodkothari.com/2026/02/from-bye-backs-to-buy-backs-how-new-taxation-rules-impact-equity-extraction/
    - https://taxguru.in/income-tax/buyback-tax-shifted-shareholders-deemed-dividend-october-2024.html
    disagreements: 'Whether the Rs 1.25 lakh LTCG exemption applies to buyback gains of listed shares
      from 1 Apr 2026: the sources describe the gain as taxed ''under the capital gains head at normal
      rates'', which would include the exemption; none states it explicitly. The post says so and flags
      it for professional confirmation. Promoter definition for unlisted companies (Companies Act promoter
      or >10% holder) taken from one source.'
  fno:
    rules:
    - F&O gains/losses are NON-SPECULATIVE business income (intraday equity is speculative, with much
      tighter set-off rules).
    - Turnover = sum of absolute profits and losses on closed trades (ICAI Guidance Note, 8th edition,
      Aug 2022). Premium received on options written is NOT added separately.
    - Tax audit if turnover exceeds Rs 10 crore where cash receipts and payments are each <=5% (always
      true for F&O); the Rs 1 crore limit applies otherwise.
    - 'Presumptive scheme: declare 6% of digital turnover as profit, available up to Rs 3 crore turnover
      (95%+ digital). A loss cannot be declared under it. Opting out within 5 years of opting in bars
      re-entry for 5 years and triggers audit if total income exceeds the basic exemption. Never having
      opted in, a loss can be declared without audit if turnover is under the threshold.'
    - Same-year set-off against any head EXCEPT salary; carry-forward 8 years against business income
      only, and ONLY if the return is filed by the due date. Form ITR-3 (ITR-4 only under presumptive).
    - 'Expenses deductible against F&O income: brokerage, exchange charges, STT, software, internet, advisory,
      depreciation on equipment.'
    - STT on futures/options sales rose from 1 April 2026 (futures 0.02% -> 0.05%; options premium 0.10%
      -> 0.15%; exercised options 0.125% -> 0.15%) announced in the Union Budget 2026-27 and effective
      1 April 2026; confirmed across several sources (ICICI Direct, HDFC Securities, ClearTax) in September
      2026.
    sources:
    - https://fnotax.com/articles/fo-taxation-turnover-guide-ay-2026-27-audits-expenses-rules/
    - https://taxsocial.pro/article/fno-intraday-trading-taxation-ay-2026-27-itr-3-audit-44ad
    - https://www.balakrishnaandco.com/news-and-articles/56-tax-audit-requirement-for-f-o-trading-fy-2025-26-ay-2026-27
    disagreements: None material between the two detailed sources. Books-of-account thresholds (income
      > Rs 1.2 lakh or turnover > Rs 10 lakh) are from one source.
  foreign:
    rules:
    - 'Foreign listed shares: long-term if held more than 24 months; LTCG 12.5% without indexation (sales
      from 23 July 2024); STCG at slab. The Rs 1.25 lakh exemption does NOT apply (it is for STT-paid
      Indian equity).'
    - 'US dividends: 25% withheld in the US under the India-US DTAA; the gross dividend is taxed in India
      at slab and the US tax is credited via Form 67 (being renumbered). Rule 128(9) as amended by CBDT
      Notification 100/2022 allows Form 67 up to the end of the assessment year if the return itself is
      filed in time; filing it with or before the return is the safe route. Credit flows through Schedule
      FSI and Schedule TR.'
    - 'Schedule FA (ITR-2/ITR-3) must be filed by every Resident and Ordinarily Resident who held ANY
      foreign asset at ANY time in the CALENDAR year (1 Jan - 31 Dec) preceding the assessment year: shares,
      brokerage and bank accounts, RSUs/ESOPs of a foreign employer. No minimum. Report cost, peak value,
      closing value and income, in INR at the SBI TT buying rate.'
    - 'Black Money Act: Rs 10 lakh penalty for non-disclosure, not levied where aggregate foreign assets
      (excluding immovable property) are under Rs 20 lakh (from 1 Oct 2024) — the disclosure duty remains.'
    - 'TCS on LRS remittances for investment: 20% on the amount above Rs 10 lakh per financial year (threshold
      unchanged by Budget 2026); recoverable against tax when filing.'
    - 'Exchange rate for computing gains: the common approach converts each leg at the SBI TT buying rate
      on the last day of the month preceding the month of purchase/sale. Practice differs (some apply
      Rule 115 to the gain computed in foreign currency instead) — flagged for professional review.'
    sources:
    - https://vested.blog/posts/schedule-fa-for-ay-2026-27-step-by-step
    - https://zerodha.com/varsity/chapter/foreign-stocks-and-taxation/
    - https://www.lakshmisri.com/insights/articles/non-disclosure-of-foreign-assets-in-the-itr-ownership-valuation-threshold-for-penalty-under-the-black-money-act/
    - https://cleartax.in/s/tax-on-foreign-remittance
    - https://www.indmoney.com/learn/us-stocks/tax-on-us-stocks
    disagreements: Sources differ on the exchange-rate DATE for Schedule FA valuation (transaction/valuation
      date) versus capital-gains computation (last day of the preceding month); the post states both as
      they apply.
