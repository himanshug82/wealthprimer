# The Tax Side of Investing - module 3 worked examples (REITs/InvITs, bonds
# and SGBs, advance tax, gifts and clubbing, NRI basics).
#
# GENERATED by scripts/derive_tax3.py - do not edit by hand; edit the script
# and re-run it. Every rupee figure in the five posts renders from here.
#
# Rules are Tax Year 2026-27, checked in September 2026 against the PRIMARY
# text of the Income-tax Act, 2025 and the Finance Act, 2026 (links in the
# `verification` block). Items a professional should confirm are under
# `verification.*.disagreements`.

verification:
  financial_year: Tax Year 2026-27 (FY 2026-27)
  verified_on: September 2026
  how: 'Checked against the primary text: the Income-tax Act, 2025 (No. 30 of 2025, Gazette of 21 August
    2025, copy hosted by ICAI), the Finance Act, 2026 (No. 4 of 2026, assent 30 March 2026, Gazette copy),
    and the Memoranda to the Finance Bills of 2023, 2024 and 2026 on indiabudget.gov.in. incometaxindia.gov.in''s
    consolidated ''as amended by Finance Act 2026'' text returned 403, so the 2025 Act was read as enacted
    and every Finance Act 2026 amendment to the sections used here was checked separately (only consequential
    cross-reference changes to s.99, s.393, s.424 and s.425; a substantive change to s.70(1)(x), the SGB
    exemption).'
  sources:
    income_tax_act_2025: https://resource.cdn.icai.org/87647dtc-aps2139-inceome-tax-act-2025.pdf
    finance_act_2026: https://egazette.gov.in/WriteReadData/2026/271439.pdf
    memorandum_finance_bill_2026: https://www.indiabudget.gov.in/doc/memo.pdf
    memorandum_finance_no2_bill_2024: https://www.indiabudget.gov.in/budget2024-25/doc/memo.pdf
    memorandum_finance_bill_2023: https://www.indiabudget.gov.in/budget2023-24/doc/memo.pdf
    rbi_sgb_faq: https://www.rbi.org.in/commonman/English/Scripts/FAQs.aspx?Id=1658
  reit:
    rules:
    - Business trust = REIT or InvIT registered under the SEBI regulations (s.2(21)).
    - Distributions keep the character they had in the trust's hands (s.223(1)).
    - 'Unit holder exemption (Schedule V, Sl. No. 5): distributed income is exempt EXCEPT the part that
      is (a) interest from an SPV, (b) dividend from an SPV that has opted for the concessional company
      rate under s.200, (c) a REIT''s rent from real estate it owns directly. Those parts are taxed in
      the unit holder''s hands (s.223(3)).'
    - 'Anything else (e.g. ''repayment of debt/capital''): taxable as income from other sources only to
      the extent of the ''specified sum'' = A - B - C (s.92(2)(k)), where A = all such distributions on
      the unit since issue (including to earlier holders), B = the unit''s ISSUE price, C = amounts already
      taxed under this clause. Origin: Finance Act 2023 (old s.56(2)(xii)).'
    - Distributions that are neither income nor taxed under s.92(2)(k) reduce the unit's cost of acquisition
      (s.72(4)).
    - 'TDS, residents: 10% on the interest, dividend and rent components, no threshold (s.393(1) Table
      Sl. 4(ii)); no TDS on a dividend from an SPV that has NOT opted for s.200 (s.393 no-deduction table,
      Sl. 5). Non-residents: 5% on SPV interest, 10% on SPV dividend, rates in force on rent (s.393(2)
      Table Sl. 6-7).'
    - 'Listed units: short-term if held 12 months or less (s.2(101)(b)(i), ''security listed in a recognised
      stock exchange''). STCG 20% if STT-paid (s.196); LTCG 12.5% above Rs 1,25,000 a year, sharing the
      equity exemption (s.198). Before 23 July 2024 the holding period was 36 months and the rates 15%/10%
      (Memorandum, Finance (No. 2) Bill 2024).'
    disagreements: 'None found in the text. OPEN for a professional: how trusts'' statements label ''other
      income'' (e.g. interest on the trust''s own deposits, taxed at the trust level and exempt in the
      holder''s hands under Schedule V Sl. 5) varies by trust; the post tells readers to follow the statement
      the trust issues under s.223(5).'
  bonds:
    rules:
    - 'Interest on bonds and debentures: income from other sources at slab. TDS on interest on securities
      to residents at 10% (''rates in force'', Finance Act 2026 First Schedule Part II; listed debentures
      named explicitly) above Rs 10,000 a year (s.393(1) Table Sl. 5(i)). The old exemption from TDS for
      listed demat debentures was removed from 1 April 2023 (Memorandum, Finance Bill 2023).'
    - 'Listed bonds/debentures: long-term after 12 months (s.2(101)(b)(i)), LTCG 12.5% without indexation
      and without the Rs 1.25 lakh exemption (s.197; the exemption in s.198 covers only equity shares,
      equity-oriented fund units and business trust units). STCG at slab.'
    - 'Unlisted bonds/debentures transferred, redeemed or maturing on or after 23 July 2024, and market-linked
      debentures (any date, listed or not): always short-term, taxed at slab (s.76(2)).'
    - 'SGB interest: 2.5% a year (RBI FAQ), taxable at slab; no TDS (RBI FAQ; Central Government securities
      are in the s.393 no-deduction table, Sl. 6).'
    - 'SGB redemption: not a transfer (so no capital gain) only ''if held by an individual from the date
      of original issue till maturity'' (s.70(1)(x) as substituted by Finance Act 2026, s.43, from 1 April
      2026). Bought on the exchange: taxable at maturity. Sold on the exchange: normal capital gains,
      listed security (12 months; LTCG 12.5%, no Rs 1.25 lakh exemption).'
    disagreements: 'OPEN: premature redemption with the RBI (allowed after the fifth year on interest
      dates, per the RBI FAQ) is not ''maturity'' on the amended wording, so it appears to fall outside
      the exemption from 1 April 2026. No official clarification found; the post flags it. Also not covered:
      accrued interest paid/received when a bond trades between coupon dates.'
  advance:
    rules:
    - Liability if the year's tax, after TDS/TCS, is Rs 10,000 or more (s.404, s.405). Resident individuals
      aged 60+ with no business/professional income are exempt (s.403(3)).
    - 'Instalments (s.408(1)): 15% by 15 June, 45% by 15 September, 75% by 15 December, 100% by 15 March
      (cumulative). Presumptive business filers: all by 15 March (s.408(2)). Anything paid by 31 March
      counts as advance tax (s.408(3)).'
    - 'Interest for deferment (s.425, old 234C): 3% on the shortfall at each of the first three dates,
      1% at 15 March. No interest if at least 12% was paid by 15 June and 36% by 15 September (s.425(2)).
      No interest on a shortfall caused by capital gains, dividends, casual income or first-year business
      income, if the tax on it is paid in the remaining instalments or by 31 March (s.425(4)).'
    - 'Interest for default (s.424, old 234B): if advance tax paid is under 90% of the assessed tax, 1%
      a month or part-month from 1 April after the tax year on the shortfall, until the tax is paid or
      assessed.'
    - Finance Act 2026 made only consequential changes to s.424 and s.425 (MAT cross-references).
    disagreements: The old Income-tax Rules rounded the amounts used for this interest (to the nearest
      hundred, down); the example ignores rounding and the post says so. Whether the new Rules keep that
      convention was not checked.
  gifts:
    rules:
    - 'Money, or property (shares and securities, jewellery, bullion, art, land/buildings, virtual digital
      assets) received without consideration from non-relatives: taxable as income from other sources
      if the aggregate in the tax year exceeds Rs 50,000 - the WHOLE amount, not the excess (s.92(2)(m);
      ''property'' in s.92(5)(f)).'
    - 'Exempt whatever the amount: from a relative; on the occasion of the individual''s marriage; under
      a will or inheritance; in contemplation of the donor''s death; and other listed cases (s.92(3)).
      ''Relative'' for an individual: spouse; brother/sister; brother/sister of the spouse; brother/sister
      of either parent; any lineal ascendant or descendant, and those of the spouse; and the spouses of
      all these (s.92(5)(g)).'
    - A gift by an individual is not a transfer for capital gains (s.70(1)(b)). The recipient takes the
      previous owner's cost (s.73(1) Table Sl. 1) and holding period (s.2(101)(c)(B)(I)). Property taxed
      under s.92(2)(m) takes that taxed value as its cost (s.73 Table Sl. 17).
    - 'Clubbing (s.99): income arising to a spouse, or a son''s wife, from assets transferred by the individual
      ''otherwise than for adequate consideration'' is taxed in the individual''s hands; all income of
      a minor child is clubbed with the parent whose income is higher (except income from the child''s
      own work or skill, or a child with a specified disability), with Rs 1,500 per child excluded (Schedule
      III, Sl. No. 17). ''Income'' includes loss (s.99(5)(d)).'
    - 'Adult children are not in s.99: income on a gift to an adult child is the child''s.'
    disagreements: 'Not in the Act''s text, and stated in the post as ''generally treated'' / worth confirming:
      (1) income earned by reinvesting clubbed income (''income on income'') is the spouse''s own; (2)
      what counts as ''adequate consideration'', and how a documented interest-bearing loan to a spouse
      is treated. Both rest on case law and practice, not the statute.'
  nri:
    rules:
    - 'Residence (s.6): resident if in India 182 days or more in the tax year, or 60 days in the year
      plus 365 days in the previous four (60 becomes 120 for a visiting citizen/PIO with Indian income
      over Rs 15 lakh). Details beyond this are out of scope.'
    - 'TDS on payments to non-residents (s.393(2)): Sl. 17 covers any sum chargeable to tax (the old s.195)
      at ''rates in force''; mutual fund income (IDCW) at 20% or the treaty rate if lower (Sl. 10, Note
      2).'
    - 'Rates in force for a non-resident Indian (Finance Act 2026, First Schedule, Part II, (b)(i)): LTCG
      on equity/equity-fund units above Rs 1,25,000 12.5%; other LTCG 12.5%; STCG on STT-paid equity 20%;
      ''investment income'' from foreign exchange assets 20%; the whole of other income 30%. Surcharge
      applies on the TDS when the income paid crosses Rs 50 lakh (capped at 15% for dividends and s.196/197/198
      gains), plus 4% cess on non-residents'' TDS (Memorandum 2026, rates section).'
    - 'Treaty relief (s.159): the Act applies only where more beneficial than the treaty (s.159(4)); a
      non-resident claiming treaty relief needs a tax residency certificate from their country of residence
      plus prescribed documents (s.159(8)). Lower/nil TDS certificate: s.395(1).'
    - 'NRE interest: exempt for an individual who is a ''person resident outside India'' under FEMA s.2(w)
      (Schedule IV, Sl. No. 1). NRO interest: taxable; TDS at 30% plus cess under the rates in force.'
    - 'The resident-only reliefs: basic-exemption shortfall adjustment against special-rate gains (s.196(2),
      s.197(2), s.198(3)) and the s.156 rebate apply to residents only.'
    disagreements: 'OPEN: the form number for the prescribed documents with a TRC (Form 10F under the
      old Rules) under the Income-tax Rules made for the 2025 Act was not checked; the post says ''the
      prescribed form''. Specific treaty rates are not quoted.'
