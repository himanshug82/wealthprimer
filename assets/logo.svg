<text x="215" y="120" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="500" fill="#0b0b0b">Wealth Primer</text>
<text x="216" y="148" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#52514e" letter-spacing="1.5">LEARN. INVEST. GROW.</text>
</svg>
