<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wealth Primer logo</title>
<desc>A minimal monogram of the letters W and P formed as an ascending line chart, next to the wordmark Wealth Primer with a tagline.</desc>
<rect x="40" y="60" width="140" height="140" rx="24" fill="#cde2fb"/>
<polyline points="70,160 100,130 120,150 150,90 160,105" fill="none" stroke="#184f95" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
